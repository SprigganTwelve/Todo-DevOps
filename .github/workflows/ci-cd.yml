name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
      name: Test  project
      runs-on: ubuntu-latest
      services:
        postgres: postgres:17
        env:
          POSTGRES_DB: todo_db
          POSTGRES_DB: todo_db
          POSTGRES_PASSWORD: todo_password
        ports:
          - 5432:5432
        options: >-
            --health-cmd "psql_isready -U todo_user -d todo_user"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: todo_user
        DB_USER: todo_user
        DB_PASSWORD: todo_password

      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22

        - name: Install PostgreSQL client
          run: sudo apt-get update && sudo apt-get install -y postgre-client
        
        - name: Initialize database
          run: |
            PGPASSWORD=todo_password psql \
              -h localhost \
              -U todo_user \
              -d todo_db \
              -f database/init.sql

        
        - name: Install dependencies & test
          run: |
            cd todo
            npm ci
            npm test
        

  build:
    name: Build and push docker image
    runs-on: ubuntu-latest
    needs: test
    
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME  }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}
        
        
      - name: Build and push image 
        uses: docker/build-push-action@v6
        with:
          context: ./todo
          file: ./todo/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
      
      
  deploy:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - run: hostname
      - run: docker ps

