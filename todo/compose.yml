services:
  todo-api:
    container_name: todo-api
    image: springgantwelve/todo-api:${TAG}
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - todo-db
    restart: always

  todo-db:
    container_name: todo-db
    image: postgres:17
    env_file:
      - .env
    volumes:
      - todo-db-data:/var/lib/postgresql/data

    restart: always

volumes:
  todo-db-data: